<ion-app>
  <ion-router-outlet></ion-router-outlet>

  <nav id="nav-bar" *ngIf="mostrarNavBar">
    <button
      class="nav-item"
      [class.nav-item-ativo]="paginaAtiva === 'home'"
      aria-label="Página inicial"
      (click)="goToHome()"
    >
      <ion-icon name="home-outline"></ion-icon>
      <span>Início</span>
    </button>

    <button
      class="nav-item"
      [class.nav-item-ativo]="paginaAtiva === 'perfil'"
      aria-label="Meu perfil"
      (click)="goToPerfil()"
    >
      <ion-icon name="person-outline"></ion-icon>
      <span>Perfil</span>
    </button>
  </nav>
</ion-app>
